# Entorno completo de DESARROLLO. Los valores por defecto sirven para aprender; no los uses en producción.
# Los puertos se publican solo en 127.0.0.1: nadie de tu red local puede entrar a tu SQL Server.
# Macs con chip Apple: SQL Server 2022 corre emulado -> añade "platform: linux/amd64" en sqlserver y dbinit
# y activa "Use Rosetta" en Docker Desktop.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Gym_Passw0rd!}
    ports: ["127.0.0.1:1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Contenedor "de un solo uso": crea la base y las tablas con db/init.sql y termina.
  dbinit:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Gym_Passw0rd!}
    volumes: ["./db:/db:ro"]
    # -I activa QUOTED_IDENTIFIER (necesario para el índice filtrado); -b hace fallar el contenedor si el script falla.
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -I -b -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /db/init.sql"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-gym}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-gym_pass}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]   # 15672 = panel web de gestión
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

volumes:
  sqldata: