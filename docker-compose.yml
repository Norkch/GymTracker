services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Gym_Passw0rd!"
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Gym_Passw0rd!" -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
  dbinit:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    volumes: ["./db:/db"]
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "sqlserver", "-U", "sa", "-P", "Gym_Passw0rd!", "-i", "/db/init.sql"]
    restart: "no"
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: { context: ., args: { PROJECT: GymTracker.Api } }
    ports: ["8080:8080"]
    environment: &env
      ConnectionStrings__Sql: "Server=sqlserver;Database=GymTracker;User Id=sa;Password=Gym_Passw0rd!;TrustServerCertificate=True"
      Rabbit__Host: rabbitmq
      Redis__Connection: redis:6379
      ASPNETCORE_URLS: http://+:8080
    volumes: [photos:/app/photos]
    depends_on:
      dbinit: { condition: service_completed_successfully }
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  worker:
    build: { context: ., args: { PROJECT: GymTracker.Worker } }
    environment: *env
    depends_on:
      dbinit: { condition: service_completed_successfully }
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
volumes:
  sqldata:
  photos: